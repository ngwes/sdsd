<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="800" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#f1f5f9">SDSD — Stupid-Driven Software Development</text>
  <text x="600" y="78" text-anchor="middle" font-size="14" fill="#94a3b8">Framework di Protezione del Developer</text>

  <!-- Central circle -->
  <circle cx="600" cy="400" r="90" fill="#1e3a5f" stroke="#3b82f6" stroke-width="3"/>
  <text x="600" y="388" text-anchor="middle" font-size="16" font-weight="bold" fill="#93c5fd">Developer</text>
  <text x="600" y="408" text-anchor="middle" font-size="16" font-weight="bold" fill="#93c5fd">+</text>
  <text x="600" y="428" text-anchor="middle" font-size="16" font-weight="bold" fill="#93c5fd">Progetto</text>

  <!-- Shield ring -->
  <circle cx="600" cy="400" r="160" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8,4" opacity="0.6"/>
  <text x="600" y="232" text-anchor="middle" font-size="11" fill="#22d3ee" opacity="0.8">── PERIMETRO DI PROTEZIONE ──</text>

  <!-- Threat Layer - outer ring labels -->
  <!-- Top: Business ignorance -->
  <ellipse cx="600" cy="100" rx="130" ry="38" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="600" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#fca5a5">Requisiti Ambigui</text>
  <text x="600" y="114" text-anchor="middle" font-size="11" fill="#fca5a5">e Volatili</text>

  <!-- Right: Scope creep -->
  <ellipse cx="1070" cy="400" rx="110" ry="38" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="1070" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#fca5a5">Scope Creep</text>
  <text x="1070" y="414" text-anchor="middle" font-size="11" fill="#fca5a5">Incontrollato</text>

  <!-- Left: Blame -->
  <ellipse cx="130" cy="400" rx="110" ry="38" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="130" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#fca5a5">Blame</text>
  <text x="130" y="414" text-anchor="middle" font-size="11" fill="#fca5a5">Ingiustificato</text>

  <!-- Bottom: Misunderstanding -->
  <ellipse cx="600" cy="700" rx="130" ry="38" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="600" y="696" text-anchor="middle" font-size="13" font-weight="bold" fill="#fca5a5">Incomprensione</text>
  <text x="600" y="714" text-anchor="middle" font-size="11" fill="#fca5a5">del Dominio</text>

  <!-- Top-right: Deadline -->
  <ellipse cx="940" cy="180" rx="110" ry="38" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="940" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#fca5a5">Deadline</text>
  <text x="940" y="194" text-anchor="middle" font-size="11" fill="#fca5a5">Arbitrarie</text>

  <!-- Top-left: Hidden stakeholders -->
  <ellipse cx="260" cy="180" rx="110" ry="38" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="260" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#fca5a5">Stakeholder</text>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#fca5a5">Invisibili</text>

  <!-- Bottom-right: Anti-patterns -->
  <ellipse cx="940" cy="620" rx="110" ry="38" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="940" y="616" text-anchor="middle" font-size="13" font-weight="bold" fill="#fca5a5">Anti-Pattern</text>
  <text x="940" y="634" text-anchor="middle" font-size="11" fill="#fca5a5">Organizzativi</text>

  <!-- Bottom-left: Communication -->
  <ellipse cx="260" cy="620" rx="110" ry="38" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="260" y="616" text-anchor="middle" font-size="13" font-weight="bold" fill="#fca5a5">Comunicazione</text>
  <text x="260" y="634" text-anchor="middle" font-size="11" fill="#fca5a5">Disfunzionale</text>

  <!-- DEFENSES - positioned on the shield ring -->

  <!-- Defense blocks - positioned between threats and center -->
  <!-- Top defense: Requirements Engineering -->
  <rect x="500" y="155" width="200" height="58" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="600" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Requirements</text>
  <text x="600" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Engineering</text>
  <text x="600" y="207" text-anchor="middle" font-size="10" fill="#86efac">Sign-off · RTM · MoSCoW</text>

  <!-- Right defense: Scope Management -->
  <rect x="855" y="370" width="160" height="58" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="935" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Scope</text>
  <text x="935" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Management</text>
  <text x="935" y="422" text-anchor="middle" font-size="10" fill="#86efac">CR · Baseline · CR Process</text>

  <!-- Left defense: Documentation -->
  <rect x="185" y="370" width="160" height="58" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="265" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Documentazione</text>
  <text x="265" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Decisionale</text>
  <text x="265" y="422" text-anchor="middle" font-size="10" fill="#86efac">ADR · Decision Log · CYA</text>

  <!-- Bottom defense: DDD + BDD -->
  <rect x="500" y="587" width="200" height="58" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="600" y="609" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">DDD + BDD</text>
  <text x="600" y="625" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Ubiquitous Lang.</text>
  <text x="600" y="639" text-anchor="middle" font-size="10" fill="#86efac">Glossario · Gherkin · ACL</text>

  <!-- Top-right defense: Agile Ceremonies -->
  <rect x="775" y="250" width="155" height="58" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="852" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Agile</text>
  <text x="852" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Cerimonie</text>
  <text x="852" y="302" text-anchor="middle" font-size="10" fill="#86efac">DoD · DoR · Review</text>

  <!-- Top-left defense: Communication Patterns -->
  <rect x="270" y="250" width="155" height="58" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="347" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Communication</text>
  <text x="347" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Patterns</text>
  <text x="347" y="302" text-anchor="middle" font-size="10" fill="#86efac">CYA · Demo · RAID</text>

  <!-- Bottom-right defense: Defensive Architecture -->
  <rect x="775" y="490" width="155" height="58" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="852" y="512" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Defensive</text>
  <text x="852" y="528" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Architecture</text>
  <text x="852" y="542" text-anchor="middle" font-size="10" fill="#86efac">ACL · Feature Flags · CQRS</text>

  <!-- Bottom-left defense: Stakeholder Mgmt -->
  <rect x="270" y="490" width="155" height="58" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2"/>
  <text x="347" y="512" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Stakeholder</text>
  <text x="347" y="528" text-anchor="middle" font-size="12" font-weight="bold" fill="#86efac">Management</text>
  <text x="347" y="542" text-anchor="middle" font-size="10" fill="#86efac">Matrix · Anti-Pattern · Escalation</text>

  <!-- Arrows from threats to defenses (red, dashed) -->
  <line x1="600" y1="138" x2="600" y2="155" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>
  <line x1="960" y1="400" x2="1015" y2="400" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="240" y1="400" x2="185" y2="400" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="600" y1="662" x2="600" y2="645" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>

  <!-- Arrows from defenses to center (green, solid) -->
  <line x1="600" y1="213" x2="600" y2="310" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="855" y1="399" x2="760" y2="399" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="345" y1="399" x2="440" y2="399" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="600" y1="587" x2="600" y2="490" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="30" y="740" width="500" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="50" y="755" width="20" height="3" fill="#ef4444"/>
  <text x="78" y="765" font-size="12" fill="#94a3b8">Minacce esterne</text>
  <rect x="170" y="755" width="20" height="3" fill="#22c55e"/>
  <text x="198" y="765" font-size="12" fill="#94a3b8">Protezioni SDSD</text>
  <circle cx="310" cy="757" r="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="326" y="762" font-size="12" fill="#94a3b8">Core protetto</text>
  <circle cx="430" cy="757" r="8" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="446" y="762" font-size="12" fill="#94a3b8">Perimetro difensivo</text>

  <!-- Version -->
  <text x="1170" y="790" text-anchor="end" font-size="10" fill="#475569">SDSD v1.0 — 2026</text>
</svg>
