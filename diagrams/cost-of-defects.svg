<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="600" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="600" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#f1f5f9">Costo di Correzione dei Difetti per Fase</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#64748b">Più tardi si trova il bug, più costa correggerlo — Barry Boehm, IBM (1970s → confermato da numerosi studi)</text>

  <!-- Chart area -->
  <!-- Y axis -->
  <line x1="120" y1="80" x2="120" y2="480" stroke="#334155" stroke-width="2"/>
  <!-- X axis -->
  <line x1="120" y1="480" x2="860" y2="480" stroke="#334155" stroke-width="2"/>

  <!-- Y axis labels -->
  <text x="110" y="485" text-anchor="end" font-size="11" fill="#64748b">1x</text>
  <text x="110" y="435" text-anchor="end" font-size="11" fill="#64748b">10x</text>
  <text x="110" y="345" text-anchor="end" font-size="11" fill="#64748b">25x</text>
  <text x="110" y="255" text-anchor="end" font-size="11" fill="#64748b">50x</text>
  <text x="110" y="165" text-anchor="end" font-size="11" fill="#64748b">75x</text>
  <text x="110" y="90" text-anchor="end" font-size="11" fill="#64748b">100x</text>
  <text x="20" y="300" text-anchor="middle" font-size="13" fill="#64748b" transform="rotate(-90, 20, 300)">Costo Relativo</text>

  <!-- Grid lines -->
  <line x1="120" y1="435" x2="860" y2="435" stroke="#1e293b" stroke-width="1"/>
  <line x1="120" y1="345" x2="860" y2="345" stroke="#1e293b" stroke-width="1"/>
  <line x1="120" y1="255" x2="860" y2="255" stroke="#1e293b" stroke-width="1"/>
  <line x1="120" y1="165" x2="860" y2="165" stroke="#1e293b" stroke-width="1"/>
  <line x1="120" y1="90" x2="860" y2="90" stroke="#1e293b" stroke-width="1"/>

  <!-- Data points and bars -->
  <!-- Requirements: 1x = bar height 4px (just a sliver) at y=476 -->
  <rect x="155" y="476" width="100" height="4" rx="3" fill="#22c55e"/>
  <text x="205" y="470" text-anchor="middle" font-size="20" fill="#22c55e">1x</text>
  <text x="205" y="510" text-anchor="middle" font-size="12" fill="#86efac" font-weight="bold">Requisiti</text>
  <text x="205" y="527" text-anchor="middle" font-size="11" fill="#64748b">Discovery</text>

  <!-- Design: 5x = y=435-20=435, height=20? Let's scale: 100x = 390px range from 480 to 90. So 1x=480, 5x ≈ 460, 10x≈441, 25x≈381, 50x≈282, 100x≈90 -->
  <!-- Scale: y = 480 - (value/100)*390 -->
  <!-- 5x: 480 - (5/100)*390 = 480-19.5 = 460 -->
  <rect x="285" y="460" width="100" height="20" rx="3" fill="#84cc16"/>
  <text x="335" y="452" text-anchor="middle" font-size="18" fill="#84cc16">5x</text>
  <text x="335" y="510" text-anchor="middle" font-size="12" fill="#bef264" font-weight="bold">Design</text>
  <text x="335" y="527" text-anchor="middle" font-size="11" fill="#64748b">Architettura</text>

  <!-- Implementation: 10x → y = 480 - (10/100)*390 = 480-39 = 441 -->
  <rect x="415" y="441" width="100" height="39" rx="3" fill="#eab308"/>
  <text x="465" y="432" text-anchor="middle" font-size="18" fill="#eab308">10x</text>
  <text x="465" y="510" text-anchor="middle" font-size="12" fill="#fde047" font-weight="bold">Sviluppo</text>
  <text x="465" y="527" text-anchor="middle" font-size="11" fill="#64748b">Implementation</text>

  <!-- Testing: 20x → y = 480 - (20/100)*390 = 480-78 = 402 -->
  <rect x="545" y="402" width="100" height="78" rx="3" fill="#f97316"/>
  <text x="595" y="392" text-anchor="middle" font-size="18" fill="#f97316">20x</text>
  <text x="595" y="510" text-anchor="middle" font-size="12" fill="#fdba74" font-weight="bold">Testing</text>
  <text x="595" y="527" text-anchor="middle" font-size="11" fill="#64748b">QA/UAT</text>

  <!-- Production: 100x → y = 480 - (100/100)*390 = 90 -->
  <rect x="720" y="90" width="100" height="390" rx="3" fill="#ef4444"/>
  <text x="770" y="78" text-anchor="middle" font-size="24" font-weight="bold" fill="#ef4444">100x</text>
  <text x="770" y="510" text-anchor="middle" font-size="12" fill="#fca5a5" font-weight="bold">Produzione</text>
  <text x="770" y="527" text-anchor="middle" font-size="11" fill="#64748b">Post-release</text>

  <!-- Exponential curve -->
  <path d="M 205 476 C 335 472 465 455 595 402 S 720 200 770 90" stroke="#38bdf8" stroke-width="2" fill="none" stroke-dasharray="6,3"/>

  <!-- SDSD annotation box -->
  <rect x="130" y="105" width="370" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="315" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#60a5fa">💡 Implicazione SDSD</text>
  <text x="145" y="155" font-size="12" fill="#93c5fd">Investire 1 ora in requirements engineering</text>
  <text x="145" y="175" font-size="12" fill="#93c5fd">equivale a risparmiare fino a 100 ore di</text>
  <text x="145" y="195" font-size="12" fill="#93c5fd">lavoro in produzione.</text>
  <text x="145" y="215" font-size="12" fill="#93c5fd">La documentazione non è overhead:</text>
  <text x="145" y="215" font-size="12" fill="#22c55e">                                     è ROI.</text>

  <!-- Arrow from annotation to bar 1 -->
  <line x1="315" y1="225" x2="280" y2="465" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

  <!-- Source note -->
  <text x="450" y="565" text-anchor="middle" font-size="11" fill="#475569">Fonte: Barry Boehm (1976), IBM Systems Sciences Institute, NIST SP 002 (2002)</text>
  <text x="450" y="582" text-anchor="middle" font-size="10" fill="#475569">Nota: i moltiplicatori esatti variano per studio e tipo di progetto; la tendenza esponenziale è consistente tra tutte le ricerche</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="870" y="595" text-anchor="end" font-size="10" fill="#475569">SDSD v1.0</text>
</svg>
