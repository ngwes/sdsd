<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="620" viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">

  <!-- Background -->
  <rect width="1100" height="620" fill="#0f172a"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#f1f5f9">Requirements Lifecycle — SDSD</text>
  <text x="550" y="65" text-anchor="middle" font-size="13" fill="#64748b">From business need to production code, with full traceability</text>

  <!-- Phase boxes -->
  <!-- Phase 1: Elicitation -->
  <rect x="30" y="100" width="170" height="380" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
  <rect x="30" y="100" width="170" height="40" rx="10" fill="#6366f1"/>
  <rect x="30" y="128" width="170" height="12" fill="#6366f1"/>
  <text x="115" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="white">1. ELICITATION</text>
  <text x="115" y="165" text-anchor="middle" font-size="11" fill="#a5b4fc">Techniques:</text>
  <text x="115" y="185" text-anchor="middle" font-size="11" fill="#c7d2fe">• Structured interviews</text>
  <text x="115" y="203" text-anchor="middle" font-size="11" fill="#c7d2fe">• Job Shadowing</text>
  <text x="115" y="221" text-anchor="middle" font-size="11" fill="#c7d2fe">• Facilitated workshops</text>
  <text x="115" y="239" text-anchor="middle" font-size="11" fill="#c7d2fe">• Event Storming</text>
  <text x="115" y="257" text-anchor="middle" font-size="11" fill="#c7d2fe">• Prototyping</text>
  <text x="115" y="275" text-anchor="middle" font-size="11" fill="#c7d2fe">• Document analysis</text>
  <line x1="50" y1="295" x2="180" y2="295" stroke="#4338ca" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="115" y="315" text-anchor="middle" font-size="11" fill="#a5b4fc">Output:</text>
  <text x="115" y="335" text-anchor="middle" font-size="11" fill="#c7d2fe">• Raw requirements list</text>
  <text x="115" y="353" text-anchor="middle" font-size="11" fill="#c7d2fe">• Draft glossary</text>
  <text x="115" y="371" text-anchor="middle" font-size="11" fill="#c7d2fe">• User personas</text>
  <text x="115" y="389" text-anchor="middle" font-size="11" fill="#c7d2fe">• Stakeholder map</text>
  <line x1="50" y1="409" x2="180" y2="409" stroke="#4338ca" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="115" y="432" text-anchor="middle" font-size="10" fill="#818cf8">⚠️ SDSD: document</text>
  <text x="115" y="449" text-anchor="middle" font-size="10" fill="#818cf8">every assumption</text>
  <text x="115" y="466" text-anchor="middle" font-size="10" fill="#818cf8">explicitly</text>

  <!-- Arrow 1->2 -->
  <line x1="200" y1="290" x2="228" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 2: Analysis -->
  <rect x="228" y="100" width="170" height="380" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="228" y="100" width="170" height="40" rx="10" fill="#8b5cf6"/>
  <rect x="228" y="128" width="170" height="12" fill="#8b5cf6"/>
  <text x="313" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="white">2. ANALYSIS</text>
  <text x="313" y="165" text-anchor="middle" font-size="11" fill="#c4b5fd">Activities:</text>
  <text x="313" y="185" text-anchor="middle" font-size="11" fill="#ddd6fe">• FR/NFR classification</text>
  <text x="313" y="203" text-anchor="middle" font-size="11" fill="#ddd6fe">• MoSCoW prioritization</text>
  <text x="313" y="221" text-anchor="middle" font-size="11" fill="#ddd6fe">• Conflict resolution</text>
  <text x="313" y="239" text-anchor="middle" font-size="11" fill="#ddd6fe">• Impact mapping</text>
  <text x="313" y="257" text-anchor="middle" font-size="11" fill="#ddd6fe">• Preliminary estimate</text>
  <text x="313" y="275" text-anchor="middle" font-size="11" fill="#ddd6fe">• FURPS+ checklist</text>
  <line x1="248" y1="295" x2="378" y2="295" stroke="#6d28d9" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="313" y="315" text-anchor="middle" font-size="11" fill="#c4b5fd">Output:</text>
  <text x="313" y="335" text-anchor="middle" font-size="11" fill="#ddd6fe">• Draft SRS</text>
  <text x="313" y="353" text-anchor="middle" font-size="11" fill="#ddd6fe">• Prioritized list</text>
  <text x="313" y="371" text-anchor="middle" font-size="11" fill="#ddd6fe">• Refined glossary</text>
  <text x="313" y="389" text-anchor="middle" font-size="11" fill="#ddd6fe">• Risk register</text>
  <line x1="248" y1="409" x2="378" y2="409" stroke="#6d28d9" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="313" y="432" text-anchor="middle" font-size="10" fill="#a78bfa">⚠️ SDSD: identify</text>
  <text x="313" y="449" text-anchor="middle" font-size="10" fill="#a78bfa">missing stakeholders</text>
  <text x="313" y="466" text-anchor="middle" font-size="10" fill="#a78bfa">before proceeding</text>

  <!-- Arrow 2->3 -->
  <line x1="398" y1="290" x2="426" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 3: Specification -->
  <rect x="426" y="100" width="170" height="380" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <rect x="426" y="100" width="170" height="40" rx="10" fill="#06b6d4"/>
  <rect x="426" y="128" width="170" height="12" fill="#06b6d4"/>
  <text x="511" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="white">3. SPECIFICATION</text>
  <text x="511" y="165" text-anchor="middle" font-size="11" fill="#a5f3fc">Format:</text>
  <text x="511" y="185" text-anchor="middle" font-size="11" fill="#cffafe">• User Stories (INVEST)</text>
  <text x="511" y="203" text-anchor="middle" font-size="11" fill="#cffafe">• Acceptance Criteria</text>
  <text x="511" y="221" text-anchor="middle" font-size="11" fill="#cffafe">• Gherkin scenarios</text>
  <text x="511" y="239" text-anchor="middle" font-size="11" fill="#cffafe">• Mockup/wireframe</text>
  <text x="511" y="257" text-anchor="middle" font-size="11" fill="#cffafe">• Formal SRS (if required)</text>
  <text x="511" y="275" text-anchor="middle" font-size="11" fill="#cffafe">• Non-functional specs</text>
  <line x1="446" y1="295" x2="576" y2="295" stroke="#0891b2" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="511" y="315" text-anchor="middle" font-size="11" fill="#a5f3fc">Traceability:</text>
  <text x="511" y="335" text-anchor="middle" font-size="11" fill="#cffafe">• RTM populated</text>
  <text x="511" y="353" text-anchor="middle" font-size="11" fill="#cffafe">• Unique ID per req.</text>
  <text x="511" y="371" text-anchor="middle" font-size="11" fill="#cffafe">• Link parent-child</text>
  <text x="511" y="389" text-anchor="middle" font-size="11" fill="#cffafe">• Ownership assigned</text>
  <line x1="446" y1="409" x2="576" y2="409" stroke="#0891b2" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="511" y="432" text-anchor="middle" font-size="10" fill="#67e8f9">⚠️ SDSD: use INVEST</text>
  <text x="511" y="449" text-anchor="middle" font-size="10" fill="#67e8f9">to check every</text>
  <text x="511" y="466" text-anchor="middle" font-size="10" fill="#67e8f9">story (Testable!)</text>

  <!-- Arrow 3->4 -->
  <line x1="596" y1="290" x2="624" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 4: Validation -->
  <rect x="624" y="100" width="170" height="380" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <rect x="624" y="100" width="170" height="40" rx="10" fill="#10b981"/>
  <rect x="624" y="128" width="170" height="12" fill="#10b981"/>
  <text x="709" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="white">4. VALIDATION</text>
  <text x="709" y="165" text-anchor="middle" font-size="11" fill="#a7f3d0">Techniques:</text>
  <text x="709" y="185" text-anchor="middle" font-size="11" fill="#d1fae5">• Walkthrough with PO</text>
  <text x="709" y="203" text-anchor="middle" font-size="11" fill="#d1fae5">• Review with domain exp.</text>
  <text x="709" y="221" text-anchor="middle" font-size="11" fill="#d1fae5">• Prototype testing</text>
  <text x="709" y="239" text-anchor="middle" font-size="11" fill="#d1fae5">• Validation checklist</text>
  <text x="709" y="257" text-anchor="middle" font-size="11" fill="#d1fae5">• Three Amigos review</text>
  <text x="709" y="275" text-anchor="middle" font-size="11" fill="#d1fae5">• Conflict check</text>
  <line x1="644" y1="295" x2="774" y2="295" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="709" y="315" text-anchor="middle" font-size="11" fill="#a7f3d0">Output:</text>
  <text x="709" y="335" text-anchor="middle" font-size="11" fill="#d1fae5">• ✅ Formal sign-off</text>
  <text x="709" y="353" text-anchor="middle" font-size="11" fill="#d1fae5">• RTM updated</text>
  <text x="709" y="371" text-anchor="middle" font-size="11" fill="#d1fae5">• Scope baseline</text>
  <text x="709" y="389" text-anchor="middle" font-size="11" fill="#d1fae5">• Acceptance test draft</text>
  <line x1="644" y1="409" x2="774" y2="409" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="709" y="432" text-anchor="middle" font-size="10" fill="#6ee7b7">⚠️ SDSD: SIGNATURE</text>
  <text x="709" y="449" text-anchor="middle" font-size="10" fill="#6ee7b7">mandatory, with date</text>
  <text x="709" y="466" text-anchor="middle" font-size="10" fill="#6ee7b7">and name of the PO</text>

  <!-- Arrow 4->5 -->
  <line x1="794" y1="290" x2="822" y2="290" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 5: Ongoing management -->
  <rect x="822" y="100" width="240" height="380" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="822" y="100" width="240" height="40" rx="10" fill="#f59e0b"/>
  <rect x="822" y="128" width="240" height="12" fill="#f59e0b"/>
  <text x="942" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c1917">5. ONGOING MANAGEMENT</text>
  <text x="942" y="165" text-anchor="middle" font-size="11" fill="#fde68a">Processes:</text>
  <text x="942" y="185" text-anchor="middle" font-size="11" fill="#fef3c7">• Change Request process</text>
  <text x="942" y="203" text-anchor="middle" font-size="11" fill="#fef3c7">• CR impact assessment</text>
  <text x="942" y="221" text-anchor="middle" font-size="11" fill="#fef3c7">• Backlog refinement</text>
  <text x="942" y="239" text-anchor="middle" font-size="11" fill="#fef3c7">• RAID log update</text>
  <text x="942" y="257" text-anchor="middle" font-size="11" fill="#fef3c7">• Velocity tracking</text>
  <text x="942" y="275" text-anchor="middle" font-size="11" fill="#fef3c7">• Sprint review/accept.</text>
  <line x1="842" y1="295" x2="1042" y2="295" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="942" y="315" text-anchor="middle" font-size="11" fill="#fde68a">Protections:</text>
  <text x="942" y="335" text-anchor="middle" font-size="11" fill="#fef3c7">• Defended scope baseline</text>
  <text x="942" y="353" text-anchor="middle" font-size="11" fill="#fef3c7">• CR budget allocation</text>
  <text x="942" y="371" text-anchor="middle" font-size="11" fill="#fef3c7">• Decision log update</text>
  <text x="942" y="389" text-anchor="middle" font-size="11" fill="#fef3c7">• RTM maintenance</text>
  <line x1="842" y1="409" x2="1042" y2="409" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="942" y="432" text-anchor="middle" font-size="10" fill="#fbbf24">⚠️ SDSD: no change</text>
  <text x="942" y="449" text-anchor="middle" font-size="10" fill="#fbbf24">without a formal</text>
  <text x="942" y="466" text-anchor="middle" font-size="10" fill="#fbbf24">signed CR</text>

  <!-- Feedback arrow from phase 5 back to phase 1 -->
  <path d="M 942 480 Q 942 560 550 560 Q 180 560 115 480" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowGray)"/>
  <text x="550" y="553" text-anchor="middle" font-size="11" fill="#64748b">New requirements or changes → the cycle restarts with a formal CR</text>

  <!-- RTM bar at bottom -->
  <rect x="30" y="510" width="1040" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="533" text-anchor="middle" font-size="12" font-weight="bold" fill="#60a5fa">REQUIREMENTS TRACEABILITY MATRIX (RTM) — spans all phases</text>
  <text x="550" y="552" text-anchor="middle" font-size="11" fill="#93c5fd">REQ-ID → User Story → Task → Commit → Test → Acceptance → Production</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="1070" y="610" text-anchor="end" font-size="10" fill="#475569">SDSD v1.0 — Requirements Lifecycle</text>
</svg>
